<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing as Gon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="black">
    <div class="gon-bg">
            <h1 class="optionsTitle">Welcome to Gon's Adventure, build up points to purchase moves from the store.</h1>
            <button id="characterSelection">Go back to character selection</button>
            <button id="gonAdventure">Adventure Screen</button>
            <button id="restoreHealth">Restore Health</button>
        <fieldset>
            <div>
                <div class="gonAttributes">
                    <h3>Attack List:</h3>
                    <p id="gonAttacks"></p>
                </div>
            </div>
            <div class="lifestock">
                <div>
                    <span class="lives">Lives:</span>
                    <span id="heart1"></span>
                    <span id="heart2"></span>
                    <span id="heart3"></span>
                </div> 
            </div>

            <div>
                <span class="gonAttributes">Nen Points: <span id="gonsNenPoints"></span></span>    
                <span class="gonAttributes">Heal Points: <span id="gonHealPoints"></span></span>
                <span class="gonAttributes">Health:<span id="gonHealth"></span></span>
                <div class="bosses">
                    <h3>Bosses Defeated: </h3>
                    <p id="bossesdefeated"></p>
                </div>
            </div>
            
            <div class="actionButtons">
                <button class="gonsButtons" id="gonButton1">Start Journey</button>
                <button class="gonsButtons" id="gonButton2">Learn New Move</button>
                <button class="gonsButtons" id="gonButton3">Boss Fight</button> 
            </div>
            <div>
                <div id="gonStats">
            </div>

            <div id="monsterStats"> 
                <span id="monsterName"></span>
                <span id="monsterHealthDigital"></span>
                <span id="monsterHealth"></span>
            </div>
    
            <div id="gonsText">
                <h3>Welcome to Gon's Adventure, select an option to get started.</h3>
            </div>
        </fieldset>
    </div>
<script src="scripts.js"></script>
</body>
</html>
